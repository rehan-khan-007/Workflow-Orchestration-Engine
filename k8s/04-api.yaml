apiVersion: apps/v1
kind: Deployment
metadata:
  name: woe-api
  namespace: workflow-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woe-api
  template:
    metadata:
      labels:
        app: woe-api
    spec:
      containers:
        - name: api
          image: woe-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: woe-config
          readinessProbe:
            httpGet:
              path: /workflows
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: woe-api
  namespace: workflow-engine
spec:
  type: NodePort
  selector:
    app: woe-api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
