<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workflow Orchestration Engine — Live Demo</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #101a2e;
    --panel-2: #0d1626;
    --line: #22304a;
    --text: #e7ecf5;
    --text-dim: #8291ad;
    --text-faint: #56637f;
    --accent: #4fd9cd;
    --accent-dim: #2c7a72;

    --c-pending: #4a5670;
    --c-queued: #6e9eff;
    --c-running: #3fe0d0;
    --c-retrying: #f0a742;
    --c-completed: #3fcb71;
    --c-failed: #f0555a;

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "IBM Plex Mono", "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  .conn-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    float: right;
    margin-top: 2px;
  }

  .conn-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: background 0.2s;
  }

  .conn-dot.live {
    background: var(--c-running);
    box-shadow: 0 0 6px var(--c-running);
  }

  .controls {
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field label {
    font-size: 11px;
    color: var(--text-dim);
  }

  .field input[type="text"] {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: var(--mono);
    font-size: 12.5px;
    width: 240px;
  }

  .field input[type="text"]:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  .workload-row {
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }

  .segmented {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
  }

  .segmented button {
    background: var(--panel-2);
    color: var(--text-dim);
    border: none;
    padding: 7px 14px;
    font-size: 12.5px;
    font-family: var(--sans);
    cursor: pointer;
    border-right: 1px solid var(--line);
  }

  .segmented button:last-child { border-right: none; }

  .segmented button.active {
    background: var(--accent-dim);
    color: var(--text);
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: var(--text-faint);
    padding: 0;
  }

  .link-btn:hover { color: var(--text); }

  .run-btn {
    margin-left: auto;
    background: var(--accent);
    color: #06231f;
    border: none;
    border-radius: 7px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .run-btn:hover { background: #6ee6db; }
  .run-btn:disabled {
    background: var(--text-faint);
    color: var(--panel-2);
    cursor: not-allowed;
  }

  textarea#jsonEditor {
    display: none;
    width: calc(100% - 48px);
    margin: 0 24px 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    min-height: 110px;
    resize: vertical;
  }

  .status-banner {
    display: none;
    margin: 0 24px 14px;
    padding: 10px 14px;
    border-radius: 7px;
    font-family: var(--mono);
    font-size: 12.5px;
    border: 1px solid var(--line);
  }

  .status-banner.show { display: block; }
  .status-banner.err { border-color: var(--c-failed); color: var(--c-failed); }
  .status-banner.ok { border-color: var(--c-completed); color: var(--c-completed); }
  .status-banner.info { border-color: var(--accent-dim); color: var(--accent); }

  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .graph-pane {
    flex: 1.4;
    border-right: 1px solid var(--line);
    position: relative;
    overflow: auto;
  }

  .graph-pane svg { display: block; }

  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }

  .log-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 280px;
  }

  .log-header {
    padding: 10px 16px;
    font-size: 11px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .log-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.7;
  }

  .log-line { white-space: pre-wrap; word-break: break-word; }
  .log-line .t { color: var(--text-faint); }
  .log-line .e { color: var(--accent); }

  /* node/edge colors driven by data-status */
  .node circle { stroke-width: 2; transition: stroke 0.25s, fill 0.25s; }
  .node text { fill: var(--text); font-family: var(--mono); font-size: 11px; }
  .node .sublabel { fill: var(--text-dim); font-size: 9.5px; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; transition: stroke 0.25s; }
  .edge.active { stroke: var(--accent); }

  [data-status="pending"] circle { fill: var(--panel-2); stroke: var(--c-pending); }
  [data-status="queued"] circle { fill: var(--panel-2); stroke: var(--c-queued); }
  [data-status="running"] circle { fill: #0c2b28; stroke: var(--c-running); }
  [data-status="retrying"] circle { fill: #2b2210; stroke: var(--c-retrying); }
  [data-status="completed"] circle { fill: #0d2417; stroke: var(--c-completed); }
  [data-status="failed"] circle { fill: #2b1213; stroke: var(--c-failed); }

  [data-status="running"] circle {
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { stroke-opacity: 1; }
    50% { stroke-opacity: 0.45; }
  }

  @media (max-width: 760px) {
    main { flex-direction: column; }
    .graph-pane { border-right: none; border-bottom: 1px solid var(--line); min-height: 280px; }
    .field input[type="text"] { width: 160px; }
  }
</style>
</head>
<body>

<header>
  <span class="conn-badge"><span class="conn-dot" id="connDot"></span><span id="connText">not connected</span></span>
  <h1>Workflow Orchestration Engine</h1>
  <p class="subtitle">Live execution demo — connects to your own running API, not a canned recording.</p>
</header>

<div class="controls">
  <div class="field">
    <label for="apiBase">API base URL</label>
    <input type="text" id="apiBase" />
  </div>
  <div class="field">
    <label for="apiKey">API key (optional)</label>
    <input type="text" id="apiKey" placeholder="only if API_KEY is set" />
  </div>
</div>

<div class="workload-row">
  <div class="segmented" id="presetGroup">
    <button data-preset="linear" class="active">Linear chain</button>
    <button data-preset="diamond">Diamond</button>
    <button data-preset="fanout">Fan-out</button>
  </div>
  <button class="link-btn" id="toggleJson">edit raw JSON</button>
  <button class="run-btn" id="runBtn">Run workflow</button>
</div>

<textarea id="jsonEditor" spellcheck="false"></textarea>
<div class="status-banner" id="statusBanner"></div>

<main>
  <div class="graph-pane">
    <div class="empty-hint" id="emptyHint">Pick a workload above and hit "Run workflow" to watch it execute against your real API.</div>
    <svg id="graphSvg" width="100%" height="100%"></svg>
  </div>
  <div class="log-pane">
    <div class="log-header">event log — raw structured events from the coordinator/worker</div>
    <div class="log-body" id="logBody"></div>
  </div>
</main>

<script>
(function () {
  const PRESETS = {
    linear: {
      name: "demo-linear-chain",
      steps: [
        { id: "fetch", dependsOn: [] },
        { id: "transform", dependsOn: ["fetch"] },
        { id: "load", dependsOn: ["transform"] },
      ],
    },
    diamond: {
      name: "demo-diamond",
      steps: [
        { id: "ingest", dependsOn: [] },
        { id: "validate", dependsOn: ["ingest"] },
        { id: "enrich", dependsOn: ["ingest"] },
        { id: "merge", dependsOn: ["validate", "enrich"] },
      ],
    },
    fanout: {
      name: "demo-fanout",
      steps: [
        { id: "plan", dependsOn: [] },
        { id: "region-us", dependsOn: ["plan"] },
        { id: "region-eu", dependsOn: ["plan"] },
        { id: "region-apac", dependsOn: ["plan"] },
        { id: "region-latam", dependsOn: ["plan"] },
        { id: "aggregate", dependsOn: ["region-us", "region-eu", "region-apac", "region-latam"] },
      ],
    },
  };

  const el = (id) => document.getElementById(id);
  const apiBaseInput = el("apiBase");
  const apiKeyInput = el("apiKey");
  const jsonEditor = el("jsonEditor");
  const toggleJsonBtn = el("toggleJson");
  const runBtn = el("runBtn");
  const statusBanner = el("statusBanner");
  const emptyHint = el("emptyHint");
  const svg = el("graphSvg");
  const logBody = el("logBody");
  const connDot = el("connDot");
  const connText = el("connText");
  const presetGroup = el("presetGroup");

  let currentPreset = "linear";
  let jsonEditorOpen = false;
  let eventSource = null;

  function currentWorkloadJson() {
    if (jsonEditorOpen) {
      try { return JSON.parse(jsonEditor.value); }
      catch (e) { throw new Error("Invalid JSON in the editor: " + e.message); }
    }
    return PRESETS[currentPreset];
  }

  presetGroup.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-preset]");
    if (!btn) return;
    currentPreset = btn.dataset.preset;
    [...presetGroup.children].forEach((b) => b.classList.toggle("active", b === btn));
    jsonEditor.value = JSON.stringify(PRESETS[currentPreset], null, 2);
    if (!jsonEditorOpen) renderStaticPreview(PRESETS[currentPreset].steps);
  });

  toggleJsonBtn.addEventListener("click", () => {
    jsonEditorOpen = !jsonEditorOpen;
    jsonEditor.style.display = jsonEditorOpen ? "block" : "none";
    toggleJsonBtn.textContent = jsonEditorOpen ? "use presets instead" : "edit raw JSON";
    if (jsonEditorOpen && !jsonEditor.value) {
      jsonEditor.value = JSON.stringify(PRESETS[currentPreset], null, 2);
    }
  });

  function showBanner(kind, text) {
    statusBanner.className = "status-banner show " + kind;
    statusBanner.textContent = text;
  }

  function hideBanner() {
    statusBanner.className = "status-banner";
  }

  function logLine(text, extra) {
    const line = document.createElement("div");
    line.className = "log-line";
    const t = new Date().toLocaleTimeString();
    line.innerHTML = '<span class="t">' + t + "</span>  " + (extra || "") + escapeHtml(text);
    logBody.appendChild(line);
    logBody.scrollTop = logBody.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  // --- Layered DAG layout: depth = 1 + max(depth of dependencies) ---
  function computeLayout(steps) {
    const depthOf = {};
    const byId = {};
    steps.forEach((s) => (byId[s.id] = s));

    function depth(id) {
      if (depthOf[id] !== undefined) return depthOf[id];
      const step = byId[id];
      if (!step.dependsOn.length) return (depthOf[id] = 0);
      depthOf[id] = 1 + Math.max(...step.dependsOn.map(depth));
      return depthOf[id];
    }
    steps.forEach((s) => depth(s.id));

    const layers = {};
    steps.forEach((s) => {
      const d = depthOf[s.id];
      (layers[d] = layers[d] || []).push(s.id);
    });

    const colWidth = 160;
    const rowHeight = 76;
    const marginX = 60;
    const marginY = 50;
    const maxLayerSize = Math.max(...Object.values(layers).map((l) => l.length));
    const positions = {};

    Object.keys(layers).forEach((depthKey) => {
      const ids = layers[depthKey];
      const layerHeight = ids.length * rowHeight;
      const totalHeight = maxLayerSize * rowHeight;
      const yOffset = (totalHeight - layerHeight) / 2;
      ids.forEach((id, i) => {
        positions[id] = {
          x: marginX + Number(depthKey) * colWidth,
          y: marginY + yOffset + i * rowHeight,
        };
      });
    });

    const width = marginX * 2 + (Object.keys(layers).length - 1) * colWidth + 40;
    const height = marginY * 2 + maxLayerSize * rowHeight;
    return { positions, width: Math.max(width, 400), height: Math.max(height, 200) };
  }

  function renderGraph(steps, statuses) {
    emptyHint.style.display = "none";
    const { positions, width, height } = computeLayout(steps);
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.innerHTML = "";

    const byId = {};
    steps.forEach((s) => (byId[s.id] = s));

    // edges first, so nodes draw on top
    steps.forEach((s) => {
      s.dependsOn.forEach((depId) => {
        const from = positions[depId];
        const to = positions[s.id];
        if (!from || !to) return;
        const midX = (from.x + to.x) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const active = statuses[s.id] && statuses[s.id] !== "pending";
        path.setAttribute("class", "edge" + (active ? " active" : ""));
        path.setAttribute(
          "d",
          "M " + from.x + " " + from.y + " C " + midX + " " + from.y + ", " + midX + " " + to.y + ", " + to.x + " " + to.y
        );
        svg.appendChild(path);
      });
    });

    steps.forEach((s) => {
      const pos = positions[s.id];
      const status = statuses[s.id] || "pending";
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "node");
      g.setAttribute("data-status", status);
      g.setAttribute("transform", "translate(" + pos.x + "," + pos.y + ")");

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("r", "22");
      g.appendChild(circle);

      const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("text-anchor", "middle");
      label.setAttribute("y", "42");
      label.textContent = s.id;
      g.appendChild(label);

      const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
      sub.setAttribute("class", "sublabel");
      sub.setAttribute("text-anchor", "middle");
      sub.setAttribute("y", "56");
      sub.textContent = status;
      g.appendChild(sub);

      svg.appendChild(g);
    });
  }

  function renderStaticPreview(steps) {
    const statuses = {};
    steps.forEach((s) => (statuses[s.id] = "pending"));
    renderGraph(steps, statuses);
  }

  function setConnected(live) {
    connDot.classList.toggle("live", live);
    connText.textContent = live ? "streaming" : "not connected";
  }

  async function runWorkflow() {
    let workload;
    try {
      workload = currentWorkloadJson();
    } catch (e) {
      showBanner("err", e.message);
      return;
    }

    const base = apiBaseInput.value.replace(/\/+$/, "");
    const key = apiKeyInput.value.trim();
    const headers = { "Content-Type": "application/json" };
    if (key) headers["Authorization"] = "Bearer " + key;

    runBtn.disabled = true;
    hideBanner();
    logBody.innerHTML = "";
    if (eventSource) { eventSource.close(); eventSource = null; }

    const statuses = {};
    workload.steps.forEach((s) => (statuses[s.id] = "pending"));
    renderGraph(workload.steps, statuses);

    let workflow;
    try {
      const res = await fetch(base + "/workflows", {
        method: "POST",
        headers,
        body: JSON.stringify(workload),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error("POST /workflows -> " + res.status + ": " + (body.error || res.statusText));
      }
      workflow = await res.json();
    } catch (e) {
      showBanner(
        "err",
        "Could not reach the API: " + e.message +
          ". Check the API base URL, that your server is running, and that CORS is enabled (it is, by default, on this build)."
      );
      runBtn.disabled = false;
      return;
    }

    showBanner("info", "workflow " + workflow.id + " — running");
    logLine("workflow created: " + workflow.id, "");

    const streamUrl = base + "/workflows/" + workflow.id + "/stream" + (key ? "?api_key=" + encodeURIComponent(key) : "");
    eventSource = new EventSource(streamUrl);

    eventSource.onopen = () => setConnected(true);

    eventSource.onmessage = (ev) => {
      let event;
      try { event = JSON.parse(ev.data); } catch { return; }

      if (event.type === "snapshot") {
        const snap = {};
        event.workflow.steps.forEach((s) => (snap[s.id] = s.status));
        renderGraph(event.workflow.steps, snap);
        return;
      }

      if (event.type === "step_status") {
        statuses[event.stepId] = event.status;
        renderGraph(workload.steps, statuses);
        logLine(event.stepId + " -> " + event.status, '<span class="e">step</span> ');
      } else if (event.type === "workflow_status") {
        logLine("workflow -> " + event.status, '<span class="e">workflow</span> ');
        if (event.status !== "running") {
          const ok = event.status === "completed";
          showBanner(ok ? "ok" : "err", "workflow " + workflow.id + " — " + event.status);
          setConnected(false);
          eventSource.close();
          runBtn.disabled = false;
        }
      }
    };

    eventSource.onerror = () => {
      setConnected(false);
      // The server closes the stream normally on a terminal workflow
      // status (see src/api/server.ts) — this fires for that case too,
      // so only treat it as a real error if the workflow never reached
      // a terminal state.
      if (statusBanner.className.indexOf("ok") === -1 && statusBanner.className.indexOf("err") === -1) {
        showBanner("err", "Stream disconnected unexpectedly.");
      }
      runBtn.disabled = false;
    };
  }

  runBtn.addEventListener("click", runWorkflow);

  // Default the API base URL to wherever this page is actually being
  // served from — the common case once this is deployed alongside the
  // API (see src/combined.ts, which serves this file itself). Falls
  // back to localhost:3000 when the page is opened as a local file
  // (window.location.origin is "null" or "file://" in that case, not a
  // usable HTTP origin) — the original local-dev workflow.
  (function setDefaultApiBase() {
    const origin = window.location.origin;
    const isUsableHttpOrigin = origin && /^https?:\/\//.test(origin);
    apiBaseInput.value = isUsableHttpOrigin ? origin : "http://localhost:3000";
  })();

  // initial preview
  renderStaticPreview(PRESETS.linear.steps);
})();
</script>

</body>
</html>
