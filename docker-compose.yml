services:
  redis:
    image: redis:7
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: workflow_engine
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d workflow_engine"]
      interval: 2s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    command: ["node", "dist/storage/migrate.js"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/workflow_engine
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/workflow_engine
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: workflow-steps
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/workflow_engine
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: workflow-steps
      WORKER_POOL_SIZE: 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
